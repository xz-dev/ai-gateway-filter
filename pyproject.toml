[project]
name = "privacy-gateway"
version = "0.1.0"
description = "FastAPI privacy gateway for encrypted text/image payloads and prompt-injection sensitive-word checks"
readme = "README.md"
authors = [
    { name = "xz-dev", email = "xiangzhedev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "presidio-anonymizer>=2.2.362",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
privacy-gateway = "privacy_gateway.main:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "httpx>=0.28.1",
    "requests>=2.34.2",
]
