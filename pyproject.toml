[project]
name = "privacy-gateway"
version = "0.1.0"
description = "Gateway-agnostic primitives for privacy filtering and crypto operations"
readme = "README.md"
authors = [
    { name = "xz-dev", email = "xiangzhedev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "cryptography>=48.0.1",
    "presidio-analyzer>=2.2.362",
    "pillow>=12.0.0",
    "presidio-anonymizer>=2.2.362",
    "presidio-image-redactor>=0.0.58",
    "spacy>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
]
