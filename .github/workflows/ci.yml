name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
      - name: Install dependencies
        run: uv sync
      - name: Prepare spaCy model
        run: uv run python scripts/prepare_spacy_model.py en_core_web_sm
      - name: Run behavior tests
        run: uv run behave
      - name: Compile library sources
        run: uv run python -m compileall -q src/privacy_gateway
      - name: Build distribution artifacts
        run: uv build --out-dir /tmp/ai-gateway-filter-build-polish-review-fixes
